{{ define "main" }}
<article class="content-shell prose">
  <h1>{{ .Title }}</h1>
  {{ if not .Date.IsZero }}
    <p class="post-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time>
      {{ with .Params.author | default .Site.Params.author }} · {{ . }}{{ end }}
    </p>
  {{ end }}
  <div class="content-body">{{ .Content }}</div>
</article>
{{ end }}
